[project]
name = "language-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "better-exchook>=1.20260303.161200",
    "discord.py>=2.5.0",
    "genanki>=0.13.0",
    "num2words>=0.5.14",
    "openai>=2.30.0",
    "paho-mqtt>=2.0",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=22.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "pyright>=1.1.0",
]
# Local/offline TTS for the Numbers deck audio (see src/tts.py). Kept out of the default
# runtime deps so the bots and deck build stay lightweight — install with:
#   uv sync --extra tts        (Piper, CPU — works anywhere)
# The cluster/H100 XTTS route also needs torch with CUDA (from the cluster's modules or
# coqui-tts's own resolution); see slurm/generate_number_audio.slurm.
tts = [
    "piper-tts>=1.2.0",
    "kokoro-onnx>=0.4.0",
    "coqui-tts>=0.24.0",
    "huggingface-hub>=0.23.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["I", "F", "E", "W", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B028", "N802", "N803"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.pyright]
typeCheckingMode = "basic"
reportMissingImports = false
reportUnknownMemberType = false
ignore = [
    "src/bbc_noticias/discord_bot.py",
    "tests/",
    "typings/",
]
