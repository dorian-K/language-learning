services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: bbc-mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    command: mosquitto -c /mosquitto/config/mosquitto.conf

  bbc-cron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bbc-cron
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DRY_RUN=${DRY_RUN:-false}
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_PORT=1883
    volumes:
      - ./crontab:/app/crontab:ro
      - ./shared:/app/shared
      - ./data:/app/data
      - ./.env:/app/.env
    entrypoint: /app/entrypoint.sh

  bbc-discord:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: bbc-discord
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_PORT=1883
    volumes:
      - ./shared:/app/shared
      - ./data:/app/data
      - ./.env:/app/.env
    entrypoint: /app/bot_entrypoint.sh

  bbc-telegram:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: bbc-telegram
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_PORT=1883
    volumes:
      - ./shared:/app/shared
      - ./data:/app/data
      - ./.env:/app/.env
    entrypoint: /app/telegram_entrypoint.sh