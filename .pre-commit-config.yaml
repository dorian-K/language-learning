repos:
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright
        language: system
        types: [python]

      - id: ruff-check
        name: ruff-check
        entry: ruff
        args: [check, --fix, --exit-non-zero-on-fix]
        language: system
        types: [python]

      - id: ruff-format
        name: ruff-format
        entry: ruff
        args: [format]
        language: system
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer